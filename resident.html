<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ward Ledger — Resident</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="seal">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="1.6"><path d="M12 2 3 7v2h18V7z"/><path d="M5 10v8M9 10v8M15 10v8M19 10v8"/><path d="M3 21h18"/></svg>
    </div>
    <div>
      <h1><a href="index.html" style="color:inherit; text-decoration:none;">Ward Ledger</a></h1>
      <div class="tagline">Participatory municipal budgeting</div>
    </div>
  </div>
  <div class="mode-switch" role="tablist" aria-label="Switch view">
    <span class="active">Resident</span>
    <a href="admin.html">Admin</a>
  </div>
  <div class="session-chip" id="session-chip"></div>
</header>
<div class="sync-note" id="sync-note"></div>
<main id="app"></main>
<footer>Vote records are chained with SHA-256 hashes for tamper visibility. Data is shared with the Admin page via this browser's local storage.</footer>

<!-- Supabase and Shared JS Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>

<script>
let session = null;
let selectedWard = WARDS[0];

function renderSessionChip(){
  const el = document.getElementById('session-chip');
  el.innerHTML = session
    ? <span class="dot"></span> ${session.name} · ${session.ward.split('—')[0].trim()} <button onclick="logout()">Sign out</button> : '';
}

function logout(){ session = null; render(); }

function renderResidentLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <h2>Verify your residency</h2>
      <label>Voter ID</label>
      <input type="text" id="in-vid" placeholder="e.g. TN-0119284" onkeydown="if(event.key==='Enter')residentLogin()">
      <button class="btn-primary" onclick="residentLogin()">Verify &amp; enter</button>
      <div id="login-error"></div>
    </div>
  </div>`;
}

function residentLogin(){
  const voterId = document.getElementById('in-vid').value.trim().toUpperCase();
  const record = VOTER_ROLL[voterId];
  if(!record){
    document.getElementById('login-error').innerHTML = <div class="login-note" style="color:var(--danger);">ID not found.</div>;
    return;
  }
  session = {name:record.name, voterId, ward:record.ward};
  selectedWard = record.ward;
  render();
}

function renderWardRail(){
  return `<div class="ward-rail">
    ${WARDS.map(w=><button class="ward-btn ${w===selectedWard?'active':''}" onclick="selectWard('${w}')"><span>${w}</span></button>).join('')}
  </div>`;
}

function selectWard(w){ selectedWard = w; render(); }

function renderBallots(){
  const list = proposalsByWard(selectedWard);
  if(list.length===0) return <div class="empty">No proposals posted.</div>;
  
  return list.map(p=>{
    const votes = votesFor(p.id);
    let btn = <button class="vote-btn" onclick="handleVote(${p.id})">Cast vote</button>;
    
    if(session && selectedWard !== session.ward) {
      btn = <button class="vote-btn" disabled>Outside ward</button>;
    } else if(session && votedVoters.has(session.voterId)) {
      btn = <button class="vote-btn voted" disabled>Vote cast</button>;
    }
    
    return <div class="ballot"><div class="info"><h3>${p.name}</h3><p>${p.desc}</p><b>${inr(p.budget)}</b></div><div class="vote-col">${btn}</div></div>;
  }).join('');
}

async function handleVote(proposalId){ 
  await castVote(proposalId, session); 
}

function render(){
  renderSessionChip();
  document.getElementById('sync-note').innerHTML = renderSyncNote();
  const app = document.getElementById('app');
  if(!session){ app.innerHTML = renderResidentLogin(); return; }
  app.innerHTML = `
  <div class="grid">
    ${renderWardRail()}
    <div>
      <section class="col-title"><h2>${selectedWard}</h2></section>
      ${renderBallots()}
      <section class="col-title" style="margin-top:28px;"><h2>Live results</h2></section>
      ${renderResultsForWard(selectedWard)}
    </div>
  </div>`;
}

// Start app by loading database state first
loadState().then(() => {
  render();
  subscribeToUpdates(render);
});
</script>
</body>
</html>
